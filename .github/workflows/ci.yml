name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: 07-cicd/package.json

      - name: Install
        working-directory: 07-cicd
        run: npm install

      - name: Test
        working-directory: 07-cicd
        run: npm test

      - name: Build Docker image
        working-directory: 07-cicd
        run: docker build -t softshop-api:ci .

      - name: Save image as TAR artifact (delivery variant B)
        working-directory: 07-cicd
        run: docker save softshop-api:ci -o softshop-api.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: softshop-api-image
          path: 07-cicd/softshop-api.tar
