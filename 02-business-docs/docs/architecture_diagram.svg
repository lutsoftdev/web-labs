  </defs>
  <line x1="180" y1="115" x2="255" y2="115" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="115" x2="515" y2="115" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="80" y="210" width="120" height="50" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-dasharray="4 3"/>
  <text x="100" y="240" font-family="Segoe UI, Arial" font-size="13">Auth (майбутнє)</text>
