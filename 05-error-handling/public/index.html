<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>SoftShop — Lab 05</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    #banner { display:none; background:#fee2e2; border:1px solid #ef4444; padding:0.75rem; margin-bottom:1rem; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    pre { background:#f3f4f6; padding:0.75rem; overflow:auto; }
  </style>
</head>
<body>
  <div id="banner">Сервіс перевантажено. Спробуйте пізніше.</div>
  <h1>SoftShop — створення замовлення</h1>
  <input id="title" value="Замовлення: навушники" style="width:100%;padding:0.5rem" />
  <p>
    <button id="submit">Створити замовлення</button>
    <button id="double">Подвійний клік (ідемпотентність)</button>
  </p>
  <pre id="out"></pre>
  <script type="module" src="./app.js"></script>
</body>
</html>
