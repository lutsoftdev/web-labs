<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360" viewBox="0 0 700 360">
  <rect width="700" height="360" fill="#fafafa"/>
  <text x="20" y="30" font-family="Segoe UI, Arial" font-size="18" font-weight="bold">SoftShop — Context Map</text>
  <rect x="40" y="70" width="160" height="80" rx="8" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="70" y="105" font-family="Segoe UI, Arial" font-size="14">Customers</text>
  <text x="55" y="125" font-family="Segoe UI, Arial" font-size="11">Customer, Auth*</text>
  <rect x="270" y="70" width="160" height="80" rx="8" fill="#dcfce7" stroke="#15803d"/>
  <text x="310" y="105" font-family="Segoe UI, Arial" font-size="14">Catalog</text>
  <text x="290" y="125" font-family="Segoe UI, Arial" font-size="11">Product, Category</text>
  <rect x="500" y="70" width="160" height="80" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="535" y="105" font-family="Segoe UI, Arial" font-size="14">Orders</text>
  <text x="510" y="125" font-family="Segoe UI, Arial" font-size="11">Order, OrderItem</text>
  <rect x="270" y="220" width="160" height="70" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-dasharray="4 3"/>
  <text x="310" y="260" font-family="Segoe UI, Arial" font-size="14">Payments*</text>
  <text x="40" y="340" font-family="Segoe UI, Arial" font-size="12" fill="#555">* майбутнє. Orders бере Product з Catalog і Customer з Customers.</text>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#333"/></marker></defs>
  <line x1="200" y1="110" x2="265" y2="110" stroke="#333" marker-end="url(#a)"/>
  <line x1="430" y1="110" x2="495" y2="110" stroke="#333" marker-end="url(#a)"/>
  <line x1="350" y1="150" x2="350" y2="215" stroke="#999" stroke-dasharray="4 3" marker-end="url(#a)"/>
</svg>
